<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200" role="img" aria-labelledby="title desc">
  <title id="title">Joris Laundry System Data Flow Diagram Level 2 Payment Processing</title>
  <desc id="desc">Level 2 data flow diagram decomposing Payment Processing into GCash QR, Cash on Delivery, and In-Store Payment processes.</desc>
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #14213d; }
      .subtitle { font: 400 16px Arial, Helvetica, sans-serif; fill: #52616f; }
      .entity { fill: #fff7ed; stroke: #c2410c; stroke-width: 2.5; }
      .external { fill: #f0fdf4; stroke: #15803d; stroke-width: 2.4; }
      .process { fill: #eef6ff; stroke: #1d4ed8; stroke-width: 2.5; }
      .subprocess-gcash { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.3; }
      .subprocess-cod { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.3; }
      .subprocess-store { fill: #ecfdf5; stroke: #16a34a; stroke-width: 2.3; }
      .store { fill: #f1f5f9; stroke: #334155; stroke-width: 2.2; }
      .note { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.6; }
      .label { font: 700 16px Arial, Helvetica, sans-serif; fill: #111827; }
      .label-sm { font: 700 14px Arial, Helvetica, sans-serif; fill: #111827; }
      .small { font: 400 13px Arial, Helvetica, sans-serif; fill: #334155; }
      .tiny { font: 400 12px Arial, Helvetica, sans-serif; fill: #475569; }
      .store-title { font: 700 14px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .flow { fill: none; stroke: #475569; stroke-width: 2.05; marker-end: url(#arrow); }
      .flow-soft { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow-soft); stroke-dasharray: 7 6; }
      .flow-blue { fill: none; stroke: #2563eb; stroke-width: 2.1; marker-end: url(#arrow-blue); }
      .flow-orange { fill: none; stroke: #ea580c; stroke-width: 2.1; marker-end: url(#arrow-orange); }
      .flow-green { fill: none; stroke: #16a34a; stroke-width: 2.1; marker-end: url(#arrow-green); }
      .flow-label { font: 600 12px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .section { fill: none; stroke: #cbd5e1; stroke-width: 1.7; stroke-dasharray: 9 7; }
      .section-label { font: 700 13px Arial, Helvetica, sans-serif; fill: #475569; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569" />
    </marker>
    <marker id="arrow-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b" />
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb" />
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#ea580c" />
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#16a34a" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1700" height="1200" />
  <text class="title" x="850" y="54" text-anchor="middle">Payment Processing - Data Flow Diagram Level 2</text>
  <text class="subtitle" x="850" y="82" text-anchor="middle">Decomposition of Process 4.0 into GCash QR, Cash on Delivery, and In-Store Payment flows</text>

  <!-- External entities -->
  <rect class="entity" x="48" y="155" width="198" height="86" rx="8" />
  <text class="label" x="147" y="188" text-anchor="middle">Customer / User</text>
  <text class="small" x="147" y="213" text-anchor="middle">submits payment choice</text>

  <rect class="entity" x="48" y="524" width="198" height="86" rx="8" />
  <text class="label" x="147" y="557" text-anchor="middle">Admin</text>
  <text class="small" x="147" y="582" text-anchor="middle">verifies or approves</text>

  <rect class="entity" x="48" y="865" width="198" height="86" rx="8" />
  <text class="label" x="147" y="898" text-anchor="middle">Staff / Cashier</text>
  <text class="small" x="147" y="923" text-anchor="middle">records in-store payment</text>

  <rect class="external" x="1440" y="160" width="210" height="86" rx="8" />
  <text class="label" x="1545" y="193" text-anchor="middle">GCash QR</text>
  <text class="small" x="1545" y="218" text-anchor="middle">QR scan and proof</text>

  <rect class="external" x="1440" y="520" width="210" height="86" rx="8" />
  <text class="label" x="1545" y="553" text-anchor="middle">Cash Collection</text>
  <text class="small" x="1545" y="578" text-anchor="middle">delivery or counter cash</text>

  <!-- System boundary -->
  <rect class="section" x="292" y="118" width="1068" height="852" rx="16" />
  <text class="section-label" x="316" y="145">4.0 Payment Processing subsystem</text>

  <!-- Shared setup processes -->
  <rect class="process" x="332" y="168" width="246" height="92" rx="18" />
  <text class="label" x="455" y="198" text-anchor="middle">4.1 Validate Booking</text>
  <text class="label" x="455" y="220" text-anchor="middle">and User</text>
  <text class="small" x="455" y="243" text-anchor="middle">session, booking ownership</text>

  <rect class="process" x="686" y="168" width="252" height="92" rx="18" />
  <text class="label" x="812" y="198" text-anchor="middle">4.2 Calculate Amount</text>
  <text class="small" x="812" y="222" text-anchor="middle">services, inventory prices</text>
  <text class="tiny" x="812" y="242" text-anchor="middle">reward discount if selected</text>

  <!-- GCash lane -->
  <rect class="section" x="316" y="306" width="1008" height="214" rx="12" />
  <text class="section-label" x="340" y="330">GCash QR path</text>

  <rect class="subprocess-gcash" x="344" y="365" width="218" height="82" rx="16" />
  <text class="label-sm" x="453" y="394" text-anchor="middle">4.3A Create GCash</text>
  <text class="label-sm" x="453" y="414" text-anchor="middle">Request</text>
  <text class="tiny" x="453" y="434" text-anchor="middle">reference: GCASH-YYYYMMDD-ID</text>

  <rect class="subprocess-gcash" x="656" y="365" width="218" height="82" rx="16" />
  <text class="label-sm" x="765" y="394" text-anchor="middle">4.4A Upload Proof</text>
  <text class="label-sm" x="765" y="414" text-anchor="middle">or Confirm Paid</text>
  <text class="tiny" x="765" y="434" text-anchor="middle">payment proof / QR confirmation</text>

  <rect class="subprocess-gcash" x="968" y="365" width="218" height="82" rx="16" />
  <text class="label-sm" x="1077" y="394" text-anchor="middle">4.5A Admin</text>
  <text class="label-sm" x="1077" y="414" text-anchor="middle">Verify GCash</text>
  <text class="tiny" x="1077" y="434" text-anchor="middle">approve / reject request</text>

  <!-- COD lane -->
  <rect class="section" x="316" y="550" width="1008" height="214" rx="12" />
  <text class="section-label" x="340" y="574">Cash on Delivery path</text>

  <rect class="subprocess-cod" x="344" y="609" width="218" height="82" rx="16" />
  <text class="label-sm" x="453" y="638" text-anchor="middle">4.3B Create COD</text>
  <text class="label-sm" x="453" y="658" text-anchor="middle">Request</text>
  <text class="tiny" x="453" y="678" text-anchor="middle">reference: COD-YYYYMMDD-ID</text>

  <rect class="subprocess-cod" x="656" y="609" width="218" height="82" rx="16" />
  <text class="label-sm" x="765" y="638" text-anchor="middle">4.4B Confirm COD</text>
  <text class="label-sm" x="765" y="658" text-anchor="middle">Readiness</text>
  <text class="tiny" x="765" y="678" text-anchor="middle">pending admin confirmation</text>

  <rect class="subprocess-cod" x="968" y="609" width="218" height="82" rx="16" />
  <text class="label-sm" x="1077" y="638" text-anchor="middle">4.5B Delivery Photo</text>
  <text class="label-sm" x="1077" y="658" text-anchor="middle">and Completion</text>
  <text class="tiny" x="1077" y="678" text-anchor="middle">COD proof, picked up, points</text>

  <!-- In-store lane -->
  <rect class="section" x="316" y="794" width="1008" height="152" rx="12" />
  <text class="section-label" x="340" y="818">In-Store Payment path</text>

  <rect class="subprocess-store" x="344" y="849" width="218" height="74" rx="16" />
  <text class="label-sm" x="453" y="878" text-anchor="middle">4.3C Record</text>
  <text class="label-sm" x="453" y="898" text-anchor="middle">In-Store Payment</text>

  <rect class="subprocess-store" x="656" y="849" width="218" height="74" rx="16" />
  <text class="label-sm" x="765" y="878" text-anchor="middle">4.4C Complete</text>
  <text class="label-sm" x="765" y="898" text-anchor="middle">Payment Record</text>

  <rect class="subprocess-store" x="968" y="849" width="218" height="74" rx="16" />
  <text class="label-sm" x="1077" y="878" text-anchor="middle">4.5C Notify</text>
  <text class="label-sm" x="1077" y="898" text-anchor="middle">User and Admin</text>

  <!-- Shared finalization -->
  <rect class="process" x="1234" y="718" width="234" height="90" rx="18" />
  <text class="label" x="1351" y="748" text-anchor="middle">4.6 Finalize</text>
  <text class="label" x="1351" y="770" text-anchor="middle">Payment Result</text>
  <text class="small" x="1351" y="793" text-anchor="middle">status, points, queue alert</text>

  <!-- Data stores -->
  <g>
    <rect class="store" x="1432" y="315" width="220" height="52" rx="3" />
    <line x1="1454" y1="315" x2="1454" y2="367" stroke="#334155" stroke-width="2" />
    <text class="store-title" x="1542" y="336" text-anchor="middle">D1 Users</text>
    <text class="tiny" x="1542" y="355" text-anchor="middle">users, points</text>

    <rect class="store" x="1432" y="390" width="220" height="52" rx="3" />
    <line x1="1454" y1="390" x2="1454" y2="442" stroke="#334155" stroke-width="2" />
    <text class="store-title" x="1542" y="411" text-anchor="middle">D2 Bookings</text>
    <text class="tiny" x="1542" y="430" text-anchor="middle">status, final_amount</text>

    <rect class="store" x="1432" y="465" width="220" height="52" rx="3" />
    <line x1="1454" y1="465" x2="1454" y2="517" stroke="#334155" stroke-width="2" />
    <text class="store-title" x="1542" y="486" text-anchor="middle">D3 Payment Requests</text>
    <text class="tiny" x="1542" y="505" text-anchor="middle">gcash_requests</text>

    <rect class="store" x="1432" y="635" width="220" height="52" rx="3" />
    <line x1="1454" y1="635" x2="1454" y2="687" stroke="#334155" stroke-width="2" />
    <text class="store-title" x="1542" y="656" text-anchor="middle">D4 Notifications</text>
    <text class="tiny" x="1542" y="675" text-anchor="middle">user/admin alerts</text>

    <rect class="store" x="1432" y="852" width="220" height="52" rx="3" />
    <line x1="1454" y1="852" x2="1454" y2="904" stroke="#334155" stroke-width="2" />
    <text class="store-title" x="1542" y="873" text-anchor="middle">D5 Transactions</text>
    <text class="tiny" x="1542" y="892" text-anchor="middle">payments, transactions</text>
  </g>

  <!-- External input flows -->
  <path class="flow-orange" d="M246 198 C280 198 302 198 332 198" />
  <text class="flow-label" x="290" y="185" text-anchor="middle">booking id</text>

  <path class="flow-orange" d="M246 213 C292 264 310 383 344 400" />
  <text class="flow-label" x="272" y="334" text-anchor="start">select GCash QR</text>

  <path class="flow-orange" d="M246 224 C307 356 312 618 344 646" />
  <text class="flow-label" x="270" y="518" text-anchor="start">select COD</text>

  <path class="flow-orange" d="M246 908 C286 908 308 893 344 887" />
  <text class="flow-label" x="294" y="886" text-anchor="middle">cash payment details</text>

  <path class="flow-orange" d="M246 565 C443 535 762 526 968 621" />
  <text class="flow-label" x="610" y="532" text-anchor="middle">approve / verify COD request</text>

  <path class="flow-orange" d="M246 552 C432 491 770 453 968 424" />
  <text class="flow-label" x="615" y="466" text-anchor="middle">approve / reject GCash request</text>

  <!-- Shared setup flows -->
  <path class="flow-blue" d="M578 214 C616 214 648 214 686 214" />
  <text class="flow-label" x="632" y="199" text-anchor="middle">valid booking</text>

  <path class="flow-blue" d="M812 260 C676 300 538 333 453 365" />
  <text class="flow-label" x="642" y="320" text-anchor="middle">amount and reward data</text>

  <path class="flow-orange" d="M812 260 C644 418 515 542 453 609" />
  <text class="flow-label" x="604" y="461" text-anchor="middle">amount and reward data</text>

  <path class="flow-green" d="M812 260 C680 558 544 784 453 849" />
  <text class="flow-label" x="598" y="764" text-anchor="middle">amount and reward data</text>

  <!-- GCash process flows -->
  <path class="flow-blue" d="M562 406 C592 406 624 406 656 406" />
  <text class="flow-label" x="609" y="392" text-anchor="middle">request id</text>
  <path class="flow-blue" d="M874 406 C904 406 936 406 968 406" />
  <text class="flow-label" x="921" y="392" text-anchor="middle">proof / confirmation</text>
  <path class="flow-blue" d="M1186 406 C1278 355 1358 248 1440 215" />
  <text class="flow-label" x="1298" y="296" text-anchor="middle">scan QR / pay</text>
  <path class="flow-blue" d="M1440 185 C1284 190 1012 250 765 365" />
  <text class="flow-label" x="1168" y="197" text-anchor="middle">payment proof</text>

  <!-- COD process flows -->
  <path class="flow-orange" d="M562 650 C592 650 624 650 656 650" />
  <text class="flow-label" x="609" y="636" text-anchor="middle">approved request</text>
  <path class="flow-orange" d="M874 650 C904 650 936 650 968 650" />
  <text class="flow-label" x="921" y="636" text-anchor="middle">ready for delivery</text>
  <path class="flow-orange" d="M1186 650 C1293 618 1355 581 1440 565" />
  <text class="flow-label" x="1308" y="602" text-anchor="middle">cash upon delivery</text>
  <path class="flow-orange" d="M1440 592 C1331 666 1267 727 1234 752" />
  <text class="flow-label" x="1345" y="705" text-anchor="middle">cash received / photo proof</text>

  <!-- In-store process flows -->
  <path class="flow-green" d="M562 887 C592 887 624 887 656 887" />
  <text class="flow-label" x="609" y="873" text-anchor="middle">cash accepted</text>
  <path class="flow-green" d="M874 887 C904 887 936 887 968 887" />
  <text class="flow-label" x="921" y="873" text-anchor="middle">completed record</text>
  <path class="flow-green" d="M1186 887 C1240 850 1278 811 1234 775" />
  <text class="flow-label" x="1220" y="842" text-anchor="middle">completion notice</text>
  <path class="flow-green" d="M1186 887 C1272 901 1360 898 1432 880" />
  <text class="flow-label" x="1302" y="910" text-anchor="middle">payment + transaction data</text>

  <!-- Finalization and store flows -->
  <path class="flow" d="M578 190 C870 302 1158 333 1432 338" />
  <text class="flow-label" x="1004" y="319" text-anchor="middle">read user and customer data</text>

  <path class="flow" d="M578 225 C850 359 1134 409 1432 416" />
  <text class="flow-label" x="1002" y="399" text-anchor="middle">read booking and update status</text>

  <path class="flow" d="M562 425 C866 480 1122 494 1432 492" />
  <text class="flow-label" x="1006" y="489" text-anchor="middle">GCash request: pending / approved / confirmation</text>

  <path class="flow" d="M562 669 C870 595 1124 512 1432 496" />
  <text class="flow-label" x="1005" y="585" text-anchor="middle">COD request: pending / approved</text>

  <path class="flow" d="M874 888 C1034 874 1244 868 1432 874" />
  <text class="flow-label" x="1145" y="861" text-anchor="middle">completed payment record</text>

  <path class="flow" d="M1468 765 C1512 729 1534 706 1542 687" />
  <text class="flow-label" x="1510" y="737" text-anchor="middle">alerts</text>

  <path class="flow" d="M1186 425 C1273 513 1341 602 1432 658" />
  <text class="flow-label" x="1282" y="565" text-anchor="middle">verification alerts</text>
  <path class="flow" d="M1186 670 C1268 680 1355 674 1432 664" />
  <text class="flow-label" x="1308" y="691" text-anchor="middle">COD alerts</text>
  <path class="flow" d="M1186 900 C1320 824 1380 722 1432 674" />
  <text class="flow-label" x="1330" y="807" text-anchor="middle">confirmation alerts</text>

  <path class="flow" d="M1468 765 C1498 792 1519 824 1534 852" />
  <text class="flow-label" x="1518" y="814" text-anchor="middle">sales data</text>

  <path class="flow" d="M968 425 C1037 520 1167 682 1234 746" />
  <text class="flow-label" x="1132" y="596" text-anchor="middle">approved GCash</text>
  <path class="flow" d="M968 670 C1066 682 1162 716 1234 752" />
  <text class="flow-label" x="1112" y="702" text-anchor="middle">confirmed COD</text>
  <path class="flow" d="M1234 777 C1091 813 920 824 765 849" />
  <text class="flow-label" x="1040" y="825" text-anchor="middle">booking final_amount / status</text>

  <!-- Feedback to actors -->
  <path class="flow-soft" d="M1432 657 C1058 220 540 137 246 193" />
  <text class="flow-label" x="838" y="184" text-anchor="middle">request submitted, approval, completion notifications</text>

  <path class="flow-soft" d="M1432 667 C1005 610 542 573 246 568" />
  <text class="flow-label" x="840" y="601" text-anchor="middle">admin notification queue</text>

  <path class="flow-soft" d="M1432 882 C1014 933 544 928 246 911" />
  <text class="flow-label" x="842" y="945" text-anchor="middle">receipt / payment confirmation</text>

  <!-- Legend -->
  <rect class="note" x="48" y="1020" width="1604" height="120" rx="8" />
  <text class="label" x="72" y="1051">Legend and scope</text>
  <rect class="process" x="74" y="1068" width="34" height="20" rx="8" />
  <text class="tiny" x="118" y="1083">Shared process</text>
  <rect class="subprocess-gcash" x="230" y="1068" width="34" height="20" rx="8" />
  <text class="tiny" x="274" y="1083">GCash subprocess</text>
  <rect class="subprocess-cod" x="440" y="1068" width="34" height="20" rx="8" />
  <text class="tiny" x="484" y="1083">COD subprocess</text>
  <rect class="subprocess-store" x="610" y="1068" width="34" height="20" rx="8" />
  <text class="tiny" x="654" y="1083">In-store subprocess</text>
  <rect class="store" x="818" y="1068" width="44" height="20" rx="2" />
  <line x1="826" y1="1068" x2="826" y2="1088" stroke="#334155" stroke-width="1.5" />
  <text class="tiny" x="872" y="1083">Data store</text>
  <line class="flow" x1="1004" y1="1078" x2="1076" y2="1078" />
  <text class="tiny" x="1090" y="1083">Primary data flow</text>
  <line class="flow-soft" x1="1240" y1="1078" x2="1312" y2="1078" />
  <text class="tiny" x="1326" y="1083">Notification or response flow</text>
  <text class="tiny" x="72" y="1116">Based on current handlers: submit_gcash_request.php, submit_cash_request.php, process_in_store_payment.php, confirm_gcash_payment.php, confirm_cod_payment.php, upload_payment_proof.php, upload_cod_confirmation.php, and admin/process_payment.php.</text>
</svg>
