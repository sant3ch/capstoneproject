<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Joris Laundry Management System Data Flow Diagram Level 1</title>
  <desc id="desc">Rearranged Level 1 data flow diagram for the current Joris Laundry system using the provided main modules.</desc>
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 32px Arial, Helvetica, sans-serif; fill: #14213d; }
      .subtitle { font: 400 15px Arial, Helvetica, sans-serif; fill: #52616f; }
      .actor { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.5; }
      .external { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2.5; }
      .process { fill: #eef6ff; stroke: #2563eb; stroke-width: 2.5; }
      .store { fill: #f1f5f9; stroke: #334155; stroke-width: 2.2; }
      .label { font: 700 16px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .small { font: 400 13px Arial, Helvetica, sans-serif; fill: #334155; }
      .tiny { font: 400 12px Arial, Helvetica, sans-serif; fill: #475569; }
      .store-title { font: 700 14px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .group-title { font: 700 13px Arial, Helvetica, sans-serif; fill: #64748b; }
      .group { fill: none; stroke: #cbd5e1; stroke-width: 1.8; stroke-dasharray: 8 7; }
      .flow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #2563eb; stroke-width: 2.05; marker-end: url(#arrow-blue); }
      .flow-orange { fill: none; stroke: #ea580c; stroke-width: 2.05; marker-end: url(#arrow-orange); }
      .flow-green { fill: none; stroke: #16a34a; stroke-width: 2.05; marker-end: url(#arrow-green); }
      .flow-soft { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow-soft); }
      .flow-label { font: 700 12px Arial, Helvetica, sans-serif; fill: #111827; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569" />
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb" />
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#ea580c" />
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#16a34a" />
    </marker>
    <marker id="arrow-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b" />
    </marker>
  </defs>

  <rect class="bg" width="1800" height="1120" />
  <text class="title" x="900" y="46" text-anchor="middle">Joris Laundry Management System - Data Flow Diagram Level 1</text>
  <text class="subtitle" x="900" y="72" text-anchor="middle">Current system modules arranged by user workflow, operations workflow, and reporting workflow</text>

  <!-- External entities -->
  <rect class="actor" x="54" y="120" width="210" height="92" rx="8" />
  <text class="label" x="159" y="154" text-anchor="middle">Customer / User</text>
  <text class="small" x="159" y="181" text-anchor="middle">registers, books, pays,</text>
  <text class="small" x="159" y="199" text-anchor="middle">views history and rewards</text>

  <rect class="actor" x="54" y="648" width="210" height="92" rx="8" />
  <text class="label" x="159" y="682" text-anchor="middle">Admin</text>
  <text class="small" x="159" y="709" text-anchor="middle">manages operations,</text>
  <text class="small" x="159" y="727" text-anchor="middle">payments, reports</text>

  <rect class="external" x="1106" y="414" width="285" height="80" rx="8" />
  <text class="label" x="1248.5" y="446" text-anchor="middle">Payment Channel</text>
  <text class="small" x="1248.5" y="473" text-anchor="middle">GCash QR, COD, Cash</text>

  <!-- Workflow groups -->
  <rect class="group" x="322" y="104" width="912" height="392" rx="14" />
  <text class="group-title" x="342" y="128">Customer-facing workflow</text>

  <rect class="group" x="322" y="548" width="912" height="280" rx="14" />
  <text class="group-title" x="342" y="572">Operations workflow</text>

  <rect class="group" x="322" y="860" width="912" height="132" rx="14" />
  <text class="group-title" x="342" y="884">Reporting workflow</text>

  <!-- Processes -->
  <rect class="process" x="360" y="150" width="270" height="86" rx="18" />
  <text class="label" x="495" y="182" text-anchor="middle">1.0 User Management</text>
  <text class="small" x="495" y="208" text-anchor="middle">registration, login, roles</text>

  <rect class="process" x="740" y="150" width="285" height="86" rx="18" />
  <text class="label" x="882.5" y="180" text-anchor="middle">2.0 User Profile &amp;</text>
  <text class="label" x="882.5" y="202" text-anchor="middle">Booking History</text>
  <text class="tiny" x="882.5" y="224" text-anchor="middle">profile, uploads, history</text>

  <rect class="process" x="360" y="300" width="270" height="92" rx="18" />
  <text class="label" x="495" y="331" text-anchor="middle">3.0 Booking &amp;</text>
  <text class="label" x="495" y="353" text-anchor="middle">Scheduling</text>
  <text class="small" x="495" y="376" text-anchor="middle">date, slot, service, machine</text>

  <rect class="process" x="740" y="300" width="285" height="92" rx="18" />
  <text class="label" x="882.5" y="331" text-anchor="middle">4.0 Payment</text>
  <text class="label" x="882.5" y="353" text-anchor="middle">Processing</text>
  <text class="small" x="882.5" y="376" text-anchor="middle">GCash, COD, in-store cash</text>

  <rect class="process" x="360" y="610" width="270" height="92" rx="18" />
  <text class="label" x="495" y="641" text-anchor="middle">5.0 Queue &amp; Order</text>
  <text class="label" x="495" y="663" text-anchor="middle">Management</text>
  <text class="small" x="495" y="686" text-anchor="middle">queue, stages, delivery</text>

  <rect class="process" x="740" y="610" width="285" height="92" rx="18" />
  <text class="label" x="882.5" y="641" text-anchor="middle">6.0 Inventory</text>
  <text class="label" x="882.5" y="663" text-anchor="middle">Management</text>
  <text class="small" x="882.5" y="686" text-anchor="middle">detergents, fabcon, stock</text>

  <rect class="process" x="360" y="724" width="270" height="86" rx="18" />
  <text class="label" x="495" y="754" text-anchor="middle">7.0 Machine &amp;</text>
  <text class="label" x="495" y="776" text-anchor="middle">Maintenance Logs</text>
  <text class="tiny" x="495" y="798" text-anchor="middle">status, usage, maintenance</text>

  <rect class="process" x="1106" y="610" width="285" height="92" rx="18" />
  <text class="label" x="1248.5" y="641" text-anchor="middle">8.0 Rewards</text>
  <text class="label" x="1248.5" y="663" text-anchor="middle">Management</text>
  <text class="small" x="1248.5" y="686" text-anchor="middle">points, vouchers, discounts</text>

  <rect class="process" x="740" y="724" width="285" height="86" rx="18" />
  <text class="label" x="882.5" y="754" text-anchor="middle">9.0 Notification</text>
  <text class="label" x="882.5" y="776" text-anchor="middle">System</text>
  <text class="small" x="882.5" y="798" text-anchor="middle">user and admin alerts</text>

  <rect class="process" x="740" y="888" width="285" height="86" rx="18" />
  <text class="label" x="882.5" y="918" text-anchor="middle">10.0 Sales &amp;</text>
  <text class="label" x="882.5" y="940" text-anchor="middle">Transactions Report</text>
  <text class="small" x="882.5" y="962" text-anchor="middle">charts, totals, receipts</text>

  <!-- Data stores -->
  <g>
    <rect class="store" x="1482" y="130" width="260" height="54" rx="3" />
    <line x1="1504" y1="130" x2="1504" y2="184" stroke="#334155" stroke-width="2" />
    <text class="store-title" x="1612" y="152" text-anchor="middle">D1 Users</text>
    <text class="tiny" x="1612" y="171" text-anchor="middle">users, user_points, profiles</text>

    <rect class="store" x="1482" y="244" width="260" height="54" rx="3" />
    <line x1="1504" y1="244" x2="1504" y2="298" stroke="#334155" stroke-width="2" />
    <text class="store-title" x="1612" y="266" text-anchor="middle">D2 Bookings</text>
    <text class="tiny" x="1612" y="285" text-anchor="middle">bookings, booking_services</text>

    <rect class="store" x="1482" y="358" width="260" height="54" rx="3" />
    <line x1="1504" y1="358" x2="1504" y2="412" stroke="#334155" stroke-width="2" />
    <text class="store-title" x="1612" y="380" text-anchor="middle">D3 Payments</text>
    <text class="tiny" x="1612" y="399" text-anchor="middle">gcash_requests, payments</text>

    <rect class="store" x="1482" y="472" width="260" height="54" rx="3" />
    <line x1="1504" y1="472" x2="1504" y2="526" stroke="#334155" stroke-width="2" />
    <text class="store-title" x="1612" y="494" text-anchor="middle">D4 Inventory</text>
    <text class="tiny" x="1612" y="513" text-anchor="middle">inventory</text>

    <rect class="store" x="1482" y="586" width="260" height="54" rx="3" />
    <line x1="1504" y1="586" x2="1504" y2="640" stroke="#334155" stroke-width="2" />
    <text class="store-title" x="1612" y="608" text-anchor="middle">D5 Machines &amp; Maintenance</text>
    <text class="tiny" x="1612" y="627" text-anchor="middle">machines, logs, schedules</text>

    <rect class="store" x="1482" y="700" width="260" height="54" rx="3" />
    <line x1="1504" y1="700" x2="1504" y2="754" stroke="#334155" stroke-width="2" />
    <text class="store-title" x="1612" y="722" text-anchor="middle">D6 Rewards</text>
    <text class="tiny" x="1612" y="741" text-anchor="middle">claimed_rewards, points</text>

    <rect class="store" x="1482" y="814" width="260" height="54" rx="3" />
    <line x1="1504" y1="814" x2="1504" y2="868" stroke="#334155" stroke-width="2" />
    <text class="store-title" x="1612" y="836" text-anchor="middle">D7 Notifications</text>
    <text class="tiny" x="1612" y="855" text-anchor="middle">notifications, admin_notifications</text>

    <rect class="store" x="1482" y="928" width="260" height="54" rx="3" />
    <line x1="1504" y1="928" x2="1504" y2="982" stroke="#334155" stroke-width="2" />
    <text class="store-title" x="1612" y="950" text-anchor="middle">D8 Transactions</text>
    <text class="tiny" x="1612" y="969" text-anchor="middle">transactions, report data</text>
  </g>

  <!-- External actor flows -->
  <path class="flow-orange" d="M264 155 C302 149 326 145 360 145" />
  <text class="flow-label" x="310" y="136" text-anchor="middle">credentials</text>

  <path class="flow-orange" d="M264 174 C420 98 610 111 740 159" />
  <text class="flow-label" x="520" y="105" text-anchor="middle">profile updates</text>

  <path class="flow-orange" d="M264 192 C318 226 328 302 360 330" />
  <text class="flow-label" x="315" y="270" text-anchor="middle">booking request</text>

  <path class="flow-orange" d="M264 202 C440 270 600 297 740 331" />
  <text class="flow-label" x="530" y="283" text-anchor="middle">payment details</text>

  <path class="flow-orange" d="M264 678 C308 654 330 650 360 650" />
  <text class="flow-label" x="315" y="638" text-anchor="middle">stage updates</text>

  <path class="flow-orange" d="M264 694 C424 710 611 712 740 673" />
  <text class="flow-label" x="510" y="720" text-anchor="middle">inventory updates</text>

  <path class="flow-orange" d="M264 714 C310 731 328 752 360 764" />
  <text class="flow-label" x="316" y="750" text-anchor="middle">machine maintenance</text>

  <path class="flow-orange" d="M264 729 C444 844 594 911 740 920" />
  <text class="flow-label" x="514" y="870" text-anchor="middle">report filters</text>

  <!-- Main workflow flows -->
  <path class="flow-blue" d="M630 193 H740" />
  <text class="flow-label" x="685" y="180" text-anchor="middle">user account data</text>

  <path class="flow-blue" d="M740 219 C650 246 565 276 506 300" />
  <text class="flow-label" x="630" y="261" text-anchor="middle">user details</text>

  <path class="flow-blue" d="M630 346 H740" />
  <text class="flow-label" x="685" y="333" text-anchor="middle">booking amount</text>

  <path class="flow-blue" d="M1025 346 C1080 346 1088 346 1110 624" />
  <text class="flow-label" x="1088" y="490" text-anchor="middle">paid/approved order</text>

  <path class="flow-blue" d="M630 368 C760 468 930 562 1110 640" />
  <text class="flow-label" x="842" y="520" text-anchor="middle">queue number and schedule</text>

  <path class="flow-blue" d="M495 392 V610" />
  <text class="flow-label" x="514" y="508">selected machines/items</text>

  <path class="flow-blue" d="M630 656 H740" />
  <text class="flow-label" x="685" y="642" text-anchor="middle">stock alerts</text>

  <path class="flow-blue" d="M630 768 H740" />
  <text class="flow-label" x="685" y="754" text-anchor="middle">machine alerts</text>

  <path class="flow-blue" d="M1025 656 H1106" />
  <text class="flow-label" x="1066" y="642" text-anchor="middle">completed bookings</text>

  <path class="flow-blue" d="M1249 702 C1210 788 1090 887 1025 930" />
  <text class="flow-label" x="1136" y="830" text-anchor="middle">points and reward usage</text>

  <path class="flow-blue" d="M883 702 V724" />
  <text class="flow-label" x="900" y="718">stock/payment/order events</text>

  <path class="flow-blue" d="M883 810 V888" />
  <text class="flow-label" x="900" y="855">status history</text>

  <!-- Payment channel flows -->
  <path class="flow-green" d="M1025 360 C1070 370 1088 424 1106 444" />
  <text class="flow-label" x="1076" y="398" text-anchor="middle">payment request</text>

  <path class="flow-green" d="M1106 472 C1064 468 1040 410 1025 374" />
  <text class="flow-label" x="1064" y="462" text-anchor="middle">receipt / proof</text>

  <!-- Store flows -->
  <path class="flow" d="M630 158 C830 94 1166 96 1482 143" />
  <text class="flow-label" x="1060" y="100" text-anchor="middle">create/read/update users</text>

  <path class="flow-soft" d="M1025 193 C1146 169 1304 159 1482 156" />
  <text class="flow-label" x="1260" y="153" text-anchor="middle">profile source</text>

  <path class="flow" d="M630 346 C900 258 1180 250 1482 269" />
  <text class="flow-label" x="1060" y="253" text-anchor="middle">booking, service, slot data</text>

  <path class="flow" d="M1025 346 C1190 376 1320 383 1482 385" />
  <text class="flow-label" x="1260" y="372" text-anchor="middle">payment records</text>

  <path class="flow" d="M1025 668 C1190 664 1340 643 1482 613" />
  <text class="flow-label" x="1265" y="635" text-anchor="middle">machine status</text>

  <path class="flow" d="M1025 662 C1190 590 1320 522 1482 499" />
  <text class="flow-label" x="1265" y="565" text-anchor="middle">inventory levels</text>

  <path class="flow" d="M630 765 C920 702 1180 625 1482 613" />
  <text class="flow-label" x="1060" y="685" text-anchor="middle">usage counts and maintenance logs</text>

  <path class="flow" d="M1391 656 C1433 666 1460 690 1482 727" />
  <text class="flow-label" x="1450" y="700" text-anchor="middle">reward records</text>

  <path class="flow" d="M1025 768 C1194 790 1328 818 1482 841" />
  <text class="flow-label" x="1265" y="800" text-anchor="middle">notification records</text>

  <path class="flow" d="M1025 930 C1190 934 1322 947 1482 955" />
  <text class="flow-label" x="1265" y="930" text-anchor="middle">transaction records</text>

  <!-- Notification feedback -->
  <path class="flow-soft" d="M740 785 C520 812 310 610 184 212" />
  <text class="flow-label" x="452" y="816" text-anchor="middle">booking, payment, delivery and reward alerts</text>

  <path class="flow-soft" d="M740 752 C520 714 350 690 264 694" />
  <text class="flow-label" x="496" y="730" text-anchor="middle">admin notifications</text>
</svg>
